name: nav_dock
description: >-
  Thumb-friendly navigation for phones, foldables and tablets: a tab bar on
  phones, one column of tabs and actions at the screen edge on wide screens.
version: 0.1.0
repository: https://github.com/JanMichaelPeter/nav_dock

topics:
  - navigation
  - tablet
  - responsive
  - foldable
  - ui

screenshots:
  - description: >-
      One app on a phone, an unfolded foldable and in split screen: navigation
      moves to the screen edge.
    path: screenshots/nav_dock_demo.gif

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

workspace:
  - example
  - packages/nav_dock_window_placement

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
