name: nav_dock_example
description: Demo of nav_dock.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Not ^17.5: from 17.5 on, go_router needs Dart 3.10.
  go_router: ^17.0.0
  nav_dock:
    path: ../
  nav_dock_window_placement:
    path: ../packages/nav_dock_window_placement

flutter:
  uses-material-design: true

dev_dependencies:
  # Tests fake the plugin's platform side.
  window_placement: ^0.0.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
