name: Publish to pub.dev

# Runs when a package tag like nav_dock-v0.1.0 is pushed (see tool/release.sh).
# The job waits for approval in the pub.dev environment, and pub.dev only
# accepts uploads from this repository's tags through that environment. Each
# package's tag pattern on pub.dev is <package>-v{{version}}.
on:
  push:
    tags:
      - 'nav_dock-v[0-9]+.[0-9]+.[0-9]+*'
      - 'nav_dock_window_placement-v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: publish
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.6

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev authenticates the upload with a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
      # Sets up the OIDC credentials that `flutter pub publish` uses.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check tag and version files
        id: package
        run: |
          package=${GITHUB_REF_NAME%-v*}
          tool/release.sh check "$package" "$GITHUB_REF_NAME"
          echo "dir=$(tool/release.sh dir "$package")" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Analyze and test
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          flutter analyze
          flutter test
      - name: Check the version against the API changes
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          package=${GITHUB_REF_NAME%-v*}
          if curl -sf "https://pub.dev/api/packages/$package" >/dev/null; then
            dart pub global activate dart_apitool
            dart pub global run dart_apitool:main diff --old "pub://$package" --new . --version-check-mode=fully
          else
            echo "$package is not on pub.dev yet; nothing to compare."
          fi
      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          flutter pub publish --dry-run
          flutter pub publish --force
