name: Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest supported Flutter (pubspec.yaml: flutter >=3.38.0).
  FLUTTER_VERSION: 3.38.1

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: flutter analyze
      - run: flutter test
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Check package
        run: flutter pub publish --dry-run

  # nav_dock has no native code; building the example checks that it and
  # window_placement compile on each platform.
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build example for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug
