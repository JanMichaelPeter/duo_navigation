name: Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest supported Flutter (pubspec.yaml: flutter >=3.35.0).
  FLUTTER_VERSION: 3.35.6

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Resolves the whole workspace: nav_dock, the adapter and the example.
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: Analyze and test each package
        run: |
          for dir in . packages/nav_dock_window_placement example; do
            echo "::group::$dir"
            (cd "$dir" && flutter analyze && if [ -d test ]; then flutter test; fi)
            echo "::endgroup::"
          done
      - name: Check the API docs (no dartdoc warnings)
        run: |
          for dir in . packages/nav_dock_window_placement; do
            (cd "$dir" && dart doc --dry-run . 2>&1 | tee /tmp/doc.log)
            grep -q "Found 0 warnings and 0 errors." /tmp/doc.log
          done
      - name: Check publishable packages
        run: |
          for dir in . packages/nav_dock_window_placement; do
            if grep -q '^publish_to: *none' "$dir/pubspec.yaml"; then
              echo "Skipping $dir (publish_to: none)"
            else
              (cd "$dir" && flutter pub publish --dry-run)
            fi
          done

  # Compares the public API with the last release on pub.dev. Runs on the
  # current stable Flutter: the released version may need a newer SDK than
  # the floor above.
  api:
    name: API diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Public API diff against the last release
        run: |
          dart pub global activate dart_apitool
          dart pub global run dart_apitool:main diff --old pub://nav_dock --new . \
            --version-check-mode=none --report-format=markdown --report-file-path=api.md
          { echo "## nav_dock public API changes"; cat api.md; } >> "$GITHUB_STEP_SUMMARY"

  # nav_dock has no native code; building the example checks that it and
  # window_placement compile on each platform.
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build example for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug
